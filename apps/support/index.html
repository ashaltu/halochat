<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HaloChat Admin & Support Operations</title>
    <style>
      :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --bg: #0f172a;
        --card-bg: #1e293b;
        --border: #334155;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --danger: #ef4444;
        --success: #10b981;
        --warning: #f59e0b;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
      }
      header {
        background-color: var(--card-bg);
        border-bottom: 1px solid var(--border);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo {
        font-size: 1.25rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: #818cf8;
      }
      .badge {
        font-size: 0.75rem;
        padding: 0.2rem 0.5rem;
        border-radius: 9999px;
        background: rgba(79, 70, 229, 0.2);
        color: #a5b4fc;
        border: 1px solid #6366f1;
      }
      nav {
        display: flex;
        gap: 0.5rem;
        background: var(--card-bg);
        padding: 0.5rem 2rem;
        border-bottom: 1px solid var(--border);
      }
      .nav-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        border-radius: 6px;
        transition: all 0.15s;
      }
      .nav-btn:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.05);
      }
      .nav-btn.active {
        color: #fff;
        background: var(--primary);
      }
      main {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border);
      }
      .card-title {
        font-size: 1.1rem;
        font-weight: 600;
      }
      input, select, textarea {
        background: #0f172a;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        font-size: 0.9rem;
        width: 100%;
        margin-top: 0.25rem;
      }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--primary);
      }
      .btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: background 0.15s;
      }
      .btn:hover { background: var(--primary-hover); }
      .btn-danger { background: var(--danger); }
      .btn-danger:hover { background: #dc2626; }
      .btn-secondary { background: #475569; }
      .btn-secondary:hover { background: #334155; }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }
      th, td {
        padding: 0.75rem;
        text-align: left;
        border-bottom: 1px solid var(--border);
        font-size: 0.875rem;
      }
      th {
        color: var(--text-muted);
        font-weight: 600;
      }
      .status-pill {
        display: inline-block;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .status-PENDING { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
      .status-RESOLVED, .status-APPROVED { background: rgba(16, 185, 129, 0.2); color: #34d399; }
      .status-REJECTED, .status-DISMISSED { background: rgba(239, 68, 68, 0.2); color: #f87171; }
      .impact-box {
        background: #0f172a;
        border-left: 4px solid var(--warning);
        padding: 1rem;
        margin-top: 1rem;
        border-radius: 0 6px 6px 0;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        align-items: center;
        justify-content: center;
        z-index: 50;
      }
      .modal.open { display: flex; }
      .modal-content {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        max-width: 600px;
        width: 90%;
        padding: 1.5rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <span>🛡️ HaloChat</span>
        <span class="badge">Support & Admin</span>
      </div>
      <div id="auth-status"></div>
    </header>

    <nav id="main-nav" style="display: none;">
      <button class="nav-btn active" data-tab="users">Accounts & Enforcement</button>
      <button class="nav-btn" data-tab="reports">Safety Reports</button>
      <button class="nav-btn" data-tab="corrections">DOB/Sex Corrections</button>
      <button class="nav-btn" data-tab="audit">Audit Logs</button>
    </nav>

    <main id="app">
      <!-- Dynamic views loaded by main.ts -->
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
